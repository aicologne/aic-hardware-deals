name: eBay deal scan (nightly)

on:
  schedule:
    # Daily 05:00 UTC (~07:00 CET / 09:00 CEST) — GitHub Actions cron is UTC.
    - cron: '0 5 * * *'
  workflow_dispatch: {}  # allow manual runs from the Actions tab

concurrency:
  group: ebay-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit refreshed ebay_deals.csv / LATEST.md / site/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run the eBay scan
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python ebay-search-skill/ebay_search.py

      - name: Render the price report (LATEST.md)
        run: python ebay-search-skill/render_report.py ebay_deals.csv LATEST.md

      - name: Publish the scan CSV into the site
        # site/ is the GitHub Pages artifact. index.html + app.js are committed
        # static files; the site reads its data from this CSV at runtime.
        run: |
          mkdir -p site/data
          cp ebay_deals.csv site/data/ebay_deals.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebay_deals.csv LATEST.md site/
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "chore: refresh eBay price report ($(date -u +%Y-%m-%d))"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: eBay deal scan (nightly)

on:
  schedule:
    # Daily 05:00 UTC (~07:00 CET / 09:00 CEST) — GitHub Actions cron is UTC.
    - cron: '0 5 * * *'
  workflow_dispatch: {}  # allow manual runs from the Actions tab

concurrency:
  group: ebay-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit refreshed ebay_deals.csv / LATEST.md / site/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run the eBay scan
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          # Optional: set a repo Variable EBAY_MARKETPLACES (Settings ->
          # Variables -> Actions), e.g. "EBAY_DE,EBAY_AT,EBAY_CH", to scan
          # multiple marketplaces. Empty = EBAY_DE only.
          EBAY_MARKETPLACES: ${{ vars.EBAY_MARKETPLACES }}
        run: python ebay-search-skill/ebay_search.py

      - name: Update the price history (site/data/history.csv)
        # One median/cheapest row per (marketplace, category) per scan date;
        # idempotent for re-runs. Powers the 30-day trendline, movers and the
        # index on the site and in LATEST.md.
        run: python ebay-search-skill/render_history.py ebay_deals.csv site/data/history.csv --date $(date -u +%Y-%m-%d)

      - name: Track per-listing prices (site/data/listing_history.csv)
        # First-seen vs last-seen price per listing URL, for "was €X on DATE"
        # repricing notes in the report, site, feed and price-drop alerts.
        run: python ebay-search-skill/render_listing_history.py ebay_deals.csv site/data/listing_history.csv --date $(date -u +%Y-%m-%d)

      - name: Fetch sold-price anchors (optional — EBAY_SOLD_ANCHORS=1)
        # Best-effort resale anchors from eBay's public "Verkauft" search.
        # Opt-in because it scrapes public HTML (see sold_anchors.py). Set the
        # repo Variable EBAY_SOLD_ANCHORS=1 under Settings -> Variables.
        env:
          EBAY_SOLD_ANCHORS: ${{ vars.EBAY_SOLD_ANCHORS }}
        if: ${{ env.EBAY_SOLD_ANCHORS == '1' }}
        run: python ebay-search-skill/sold_anchors.py ebay_deals.csv sold_anchors.csv

      - name: Render the price report (LATEST.md)
        run: python ebay-search-skill/render_report.py ebay_deals.csv LATEST.md site/data/history.csv site/data/listing_history.csv sold_anchors.csv

      - name: Render the RSS feed (site/feed.xml)
        # Deal highlights as RSS 2.0; regenerated every run so the feed stays
        # fresh for subscribers (feed.xml lives under site/, so the git add and
        # the Pages artifact below pick it up automatically).
        run: python ebay-search-skill/render_feed.py ebay_deals.csv site/feed.xml site/data/listing_history.csv

      - name: Publish the scan CSV into the site
        # site/ is the GitHub Pages artifact. index.html + app.js are committed
        # static files; the site reads its data from this CSV at runtime.
        run: |
          mkdir -p site/data
          cp ebay_deals.csv site/data/ebay_deals.csv

        # Only runs when a channel is configured. Notifies about NEW flagged
        # deals only (site/data/notified.json dedupes across runs) and commits
        # the updated state below.        
      - name: Send buy-low alerts (Telegram/Discord)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        if: ${{ env.TELEGRAM_BOT_TOKEN || env.DISCORD_WEBHOOK_URL }}
        run: python ebay-search-skill/notify.py ebay_deals.csv --state site/data/notified.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebay_deals.csv LATEST.md site/ sold_anchors.csv
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh eBay price report ($(date -u +%Y-%m-%d))"
          # The nightly cron can race other runs (manual dispatch, retries): the
          # remote main may have advanced past this checkout, so a plain push gets
          # rejected as non-fast-forward. Fetch, rebase onto the latest remote and
          # retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            git fetch origin main || { echo "fetch failed — retry $attempt/5 in 5s..."; sleep 5; continue; }
            if git rebase origin/main; then
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "remote moved — rebase/push retry $attempt/5 in 5s..."
            sleep 5
          done
          echo "Could not push after 5 attempts" >&2
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

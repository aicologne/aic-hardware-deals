name: eBay deal scan (nightly)

on:
  schedule:
    # Daily 05:00 UTC (~07:00 CET / 09:00 CEST) — GitHub Actions cron is UTC.
    - cron: '0 5 * * *'
  workflow_dispatch: {}  # allow manual runs from the Actions tab

concurrency:
  group: ebay-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit refreshed ebay_deals.csv / LATEST.md / site/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests markdown

      - name: Run the eBay scan
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python ebay-search-skill/ebay_search.py

      - name: Render the price report (LATEST.md)
        run: python ebay-search-skill/render_report.py ebay_deals.csv LATEST.md

      - name: Build HTML site (site/index.html)
        run: |
          mkdir -p site
          python - <<'EOF'
          import markdown, pathlib
          body = markdown.markdown(
              pathlib.Path('LATEST.md').read_text(encoding='utf-8'),
              extensions=['tables', 'fenced_code'],
          )
          html = (
              "<!doctype html><html lang='en'><head>"
              "<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>"
              "<title>eBay.de Used Hardware — Price Report</title>"
              "<style>"
              "body{max-width:980px;margin:2rem auto;padding:0 1rem;font-family:system-ui,-apple-system,sans-serif;"
              "line-height:1.6;color:#1a1a1a}"
              "table{border-collapse:collapse;width:100%;margin:1rem 0}"
              "th,td{border:1px solid #d0d7de;padding:.45rem .6rem;text-align:left;font-size:.95rem}"
              "th{background:#f6f8fa}tr:nth-child(even){background:#fafbfc}"
              "a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}"
              "code{background:#f6f8fa;padding:.1rem .3rem;border-radius:4px}"
              "h1,h2{border-bottom:1px solid #d8dee4;padding-bottom:.3rem}"
              "</style></head><body>" + body + "</body></html>"
          )
          pathlib.Path('site/index.html').write_text(html, encoding='utf-8')
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebay_deals.csv LATEST.md site/index.html
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "chore: refresh eBay price report ($(date -u +%Y-%m-%d))"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

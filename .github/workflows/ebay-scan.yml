name: eBay deal scan (nightly)

on:
  schedule:
    # Daily 05:00 UTC (~07:00 CET / 09:00 CEST) — GitHub Actions cron is UTC.
    - cron: '0 5 * * *'
  workflow_dispatch: {}  # allow manual runs from the Actions tab

concurrency:
  group: ebay-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit refreshed ebay_deals.csv / LATEST.md / site/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run unit tests (Python + JS)
        # Guard the whole pipeline: window math, price parsing, chunk splitting,
        # CSV/board rendering. A regression here would silently break the
        # nightly scan or the deployed site.
        run: |
          python -m unittest discover -s ebay-search-skill/tests -v
          node --test tests/stats.test.mjs tests/marketplace.test.mjs
          node tests/marketplace_smoke.mjs

      - name: Run the eBay scan
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          # Optional: set a repo Variable EBAY_MARKETPLACES (Settings ->
          # Variables -> Actions), e.g. "EBAY_DE,EBAY_AT,EBAY_CH", to scan
          # multiple marketplaces. Empty = EBAY_DE only.
          EBAY_MARKETPLACES: ${{ vars.EBAY_MARKETPLACES }}
        run: python ebay-search-skill/ebay_search.py

      - name: Update the price history (site/data/history.csv)
        # One median/cheapest row per (marketplace, category) per scan date;
        # idempotent for re-runs. Powers the 30-day trendline, movers and the
        # index on the site and in LATEST.md.
        run: python ebay-search-skill/render_history.py ebay_deals.csv site/data/history.csv --date $(date -u +%Y-%m-%d)

      - name: Assert this run actually produced data
        # A scan that returns nothing, or a history step that silently fails,
        # used to leave the site serving yesterday's prices with a green check.
        # Today's row is ~0 h old here; if only yesterday's row exists the age
        # jumps past 20 h and the run goes red (check_freshness.py, unit-tested).
        run: python ebay-search-skill/check_freshness.py --history site/data/history.csv --max-age-hours 20

      - name: Track per-listing prices (site/data/listing_history.csv)
        # First-seen vs last-seen price per listing URL, for "was €X on DATE"
        # repricing notes in the report, site, feed and price-drop alerts.
        run: python ebay-search-skill/render_listing_history.py ebay_deals.csv site/data/listing_history.csv --date $(date -u +%Y-%m-%d)

      - name: Fetch sold-price anchors (optional — EBAY_SOLD_ANCHORS=1)
        # Best-effort resale anchors from eBay's public "Verkauft" search.
        # Opt-in because it scrapes public HTML (see sold_anchors.py). Set the
        # repo Variable EBAY_SOLD_ANCHORS=1 under Settings -> Variables.
        env:
          EBAY_SOLD_ANCHORS: ${{ vars.EBAY_SOLD_ANCHORS }}
        if: ${{ env.EBAY_SOLD_ANCHORS == '1' }}
        run: python ebay-search-skill/sold_anchors.py ebay_deals.csv sold_anchors.csv

      - name: Publish sold anchors into the site (site/data/sold_anchors.csv)
        # The site's category tables show a "Sold ≈" resale anchor when this
        # file is present (app.js fetches it at runtime). Missing file = the
        # anchors were not fetched (opt-in), so publish only when it exists.
        run: |
          if [ -f sold_anchors.csv ]; then
            mkdir -p site/data
            cp sold_anchors.csv site/data/sold_anchors.csv
          fi

      - name: Render the price report (LATEST.md)
        run: python ebay-search-skill/render_report.py ebay_deals.csv LATEST.md site/data/history.csv site/data/listing_history.csv sold_anchors.csv

      - name: Render the RSS feed (site/feed.xml)
        # Deal highlights as RSS 2.0; regenerated every run so the feed stays
        # fresh for subscribers (feed.xml lives under site/, so the git add and
        # the Pages artifact below pick it up automatically).
        run: python ebay-search-skill/render_feed.py ebay_deals.csv site/feed.xml site/data/listing_history.csv

      - name: Publish the scan CSV into the site
        # site/ is the GitHub Pages artifact. index.html + app.js are committed
        # static files; the site reads its data from this CSV at runtime.
        run: |
          mkdir -p site/data
          cp ebay_deals.csv site/data/ebay_deals.csv

      - name: Split the deal data per category (site/data/deals/)
        # The site fetches one small file per category in parallel (with
        # individual timeouts) instead of one big CSV — a stalled request can
        # no longer blank the whole report. index.json lists the chunks.
        run: |
          python ebay-search-skill/split_deals.py ebay_deals.csv site/data/deals

      - name: Generate Facebook Marketplace link sheets (deep links only)
        # Marketplace has NO public API, and scraping it violates Facebook's
        # ToS (same stance as Kleinanzeigen — see facebook-marketplace-skill/
        # SKILL.md §7). This step therefore only regenerates per-country/city
        # search DEEP LINKS — fully offline, no credentials, no ToS risk.
        # Products come from ebay-search-skill/queries.py: every query with an
        # `mp` block gets a sheet + rows automatically (single source of truth).
        # Countries come from the repo Variable FB_MARKETPLACES
        # (Settings -> Variables -> Actions); empty = DE,AT,CH,GB.
        env:
          FB_MARKETPLACES: ${{ vars.FB_MARKETPLACES }}
        run: |
          MP="${FB_MARKETPLACES:-DE,AT,CH,GB}"
          python facebook-marketplace-skill/fb_marketplace.py --from-queries \
            --countries "$MP" --csv site/data/marketplace/searches.csv \
            --report-dir site/data/marketplace

      - name: Build the Marketplace watchlist (user-pasted links only)
        # The user maintains site/data/marketplace/collected_links.txt by
        # pasting links they found while browsing Marketplace in their OWN
        # browser (normal use). This step parses them OFFLINE — no automated
        # access to facebook.com — into a deduped watchlist with first/last
        # seen dates (state persists in watchlist_state.json). No file = no-op.
        run: |
          if [ -s site/data/marketplace/collected_links.txt ]; then
            python facebook-marketplace-skill/fb_marketplace.py --collect \
              site/data/marketplace/collected_links.txt \
              --state site/data/marketplace/watchlist_state.json \
              --out site/data/marketplace/watchlist.csv \
              --report site/data/marketplace/watchlist.md
          else
            echo "No site/data/marketplace/collected_links.txt yet — skipping the watchlist step"
          fi

        # Only runs when a channel is configured. Notifies about NEW flagged
        # deals only (site/data/notified.json dedupes across runs) and commits
        # the updated state below.        
      - name: Send buy-low alerts (Telegram/Discord)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        if: ${{ env.TELEGRAM_BOT_TOKEN || env.DISCORD_WEBHOOK_URL }}
        run: python ebay-search-skill/notify.py ebay_deals.csv --state site/data/notified.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebay_deals.csv LATEST.md site/
          [ -f sold_anchors.csv ] && git add sold_anchors.csv
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh nightly eBay report + Marketplace link sheets ($(date -u +%Y-%m-%d))"
          # ... rest of the script
          # The nightly cron can race other runs (manual dispatch, retries): the
          # remote main may have advanced past this checkout, so a plain push gets
          # rejected as non-fast-forward. Fetch, rebase onto the latest remote and
          # retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            git fetch origin main || { echo "fetch failed — retry $attempt/5 in 5s..."; sleep 5; continue; }
            if git rebase origin/main; then
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "remote moved — rebase/push retry $attempt/5 in 5s..."
            sleep 5
          done
          echo "Could not push after 5 attempts" >&2
          exit 1

      - name: Alert on failure (Telegram/Discord)
        # From 2026-08-30 to 2026-09-08 every scheduled run died at the unit
        # tests and nobody was told: ten nights of frozen prices. Say it out
        # loud instead. Runs even when an earlier step failed (if: failure()),
        # and is a no-op when no channel is configured.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ebay-search-skill/alert.py "❌ eBay nightly scan failed (run $GITHUB_RUN_ID, $GITHUB_REF_NAME) — the site may be serving stale data: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
